packages:
  - apps/*
  - packages/state/*
  - packages/ui/core
  - packages/ui/templates
  - packages/ui/cli
  - packages/ui/apps/*
  - packages/template

allowBuilds:
  esbuild: true
  sharp: true
  '@tailwindcss/oxide': true
  unrs-resolver: true
  '@parcel/watcher': false
  '@swc/core': false

minimumReleaseAgeExclude:
  - '@ssgoi/core@7.3.1'
  - '@ssgoi/react@7.3.1'
